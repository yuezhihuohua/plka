<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏到 Plka</title><link rel="icon" href="/brand.svg"><link rel="stylesheet" href="/tag-picker.css"><link rel="stylesheet" href="/collect.css"><script src="/collect.js" type="module"></script></head><body><main class="collector"><header><img src="/brand.svg" alt=""><div><span class="eyebrow">SAVE YOUR NEXT IDEA</span><h1>收藏到 Plka</h1></div><a href="/" target="_blank" rel="noopener">打开图库 ↗</a></header><p id="source">正在准备收藏…</p><p class="hint">选择图片和收藏夹，再确认保存。下载期间请保留原网页。</p><div class="selection"><span id="count"></span><label><input type="checkbox" id="select-all">全选</label></div><section id="images" aria-label="选择要收藏的图片"></section><section class="fields"><label>放入收藏夹<select id="folder"><option value="">请选择收藏夹</option></select></label><div class="create"><input id="folder-name" maxlength="80" placeholder="新建收藏夹，例如：海报排版" aria-label="新收藏夹名称"><button id="create-folder">＋ 新建</button></div><label>收藏笔记（可选）<textarea id="note" rows="2" placeholder="你喜欢这些参考的什么？"></textarea></label><span>标签，点选即可</span><div id="tags"></div></section><p id="status" role="status"></p><footer><button id="cancel">取消收藏</button><button id="save" class="primary" disabled>确认收藏</button></footer><p class="footnote">图片保存在自己的电脑上 · 无需填写连接码</p></main><dialog id="result"><div class="result-symbol">✓</div><h2 id="result-title"></h2><p id="result-message"></p><button id="result-close" class="primary">完成并关闭</button><a id="result-library" href="/">打开图库 ↗</a></dialog></body></html>
