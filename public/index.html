<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plka · 你的设计参考图库</title><link rel="icon" href="/brand.svg"><link rel="stylesheet" href="/tag-picker.css"><link rel="stylesheet" href="/styles.css"><script src="/app.js" type="module"></script></head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg"><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 4h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol><symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4"/></symbol><symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5ZM9 11h6M9 15h6M14 3v5h5"/></symbol></svg>
<aside class="sidebar">
  <div class="brand"><img class="brand-mark" src="/brand.svg" alt="Plka 标志"><div><img class="wordmark" src="/wordmark.svg" alt="Plka"><small>A PLACE FOR IDEAS</small></div><span class="version">0.4.0</span></div>
  <button class="nav-item active" id="all-items"><svg><use href="#i-grid"/></svg><span>全部图片</span><span class="count" id="all-count">0</span></button>
  <button class="nav-item" id="reports-nav"><svg><use href="#i-note"/></svg><span>分析报告</span><span class="count" id="report-count">0</span></button>
  <div class="section-label"><span>我的收藏夹</span><button id="add-folder" class="icon-button" title="新建收藏夹" aria-label="新建收藏夹"><svg><use href="#i-plus"/></svg></button></div>
  <nav id="collections"></nav>
  <div class="sidebar-bottom"><button class="nav-item" id="trash-nav"><svg><use href="#i-trash"/></svg><span>回收站</span><span id="trash-count" class="count">0</span></button><button class="nav-item" id="codex-skill"><svg><use href="#i-spark"/></svg><span>Codex Skill</span></button><button class="nav-item" id="settings"><svg><use href="#i-settings"/></svg><span>图库与备份</span></button><div class="local-status"><span></span>本地保存 · 由你掌握</div></div>
</aside>
<main>
  <header class="topbar"><span class="breadcrumb">我的图库 <span>/</span> <b id="breadcrumb">全部图片</b></span><label class="search"><svg><use href="#i-search"/></svg><input type="search" id="search" placeholder="搜索名称、标签或备注" aria-label="搜索图片"><kbd>⌘ K</kbd></label></header>
  <div class="main-content">
    <div class="page-heading"><div><div class="eyebrow">A SPACE FOR YOUR NEXT IDEA</div><h1 id="page-title">全部图片</h1><p id="page-description">把散落的灵感，变成下一次设计的起点。</p></div><div class="actions"><button id="import-button"><svg><use href="#i-import"/></svg>导入图片</button><button id="analyze-button" class="primary"><svg><use href="#i-spark"/></svg>用 Codex 分析</button></div></div>
    <div class="toolbar"><div><span id="result-count">0 张图片</span><button id="rename-folder" class="text-button hidden">重命名收藏夹</button><button id="delete-folder" class="text-button danger-text hidden">删除收藏夹</button></div><div><span class="subtle">排列</span><select id="sort" aria-label="图片排列"><option value="newest">最近收藏</option><option value="oldest">最早收藏</option><option value="name">图片名称</option></select><input id="density" type="range" min="120" max="300" step="10" value="190" aria-label="缩略图大小"></div></div>
    <div id="trash-tools" class="trash-tools hidden"><label><input type="checkbox" id="trash-select-all">选择当前已显示图片</label><span id="trash-selected-count">已选 0 张</span><button id="trash-delete-selected" class="danger" disabled>永久删除所选</button><button id="trash-clear" class="danger">清空整个回收站</button></div>
    <section id="gallery" class="gallery" aria-label="图片列表"></section>
    <section id="empty" class="empty hidden"><div class="empty-art"><span></span><span></span><span></span><svg><use href="#i-plus"/></svg></div><h2>给下一个设计，留一点灵感</h2><p>导入你的参考图片，或用 Chrome 扩展从网页收藏。<br>先建一个收藏夹，让参考围绕项目慢慢生长。</p><div><button class="primary" id="empty-import">导入第一张图片</button><button id="empty-folder">新建收藏夹</button></div><a href="/demo" target="_blank" rel="noopener">打开采集测试页 ↗</a></section>
    <section id="reports" class="hidden"></section><button class="load-more hidden" id="load-more">加载更多图片</button>
  </div><div class="drop-overlay hidden" id="drop-overlay">松开鼠标，导入图片</div>
</main>
<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple id="file-input" hidden>
<dialog id="modal"><form method="dialog" class="modal-shell"><div class="modal-heading"><h2 id="modal-title"></h2><button value="cancel" class="icon-button close" aria-label="关闭">×</button></div><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div></form></dialog>
<aside id="detail" class="detail hidden" aria-label="图片详情"><div class="detail-top"><span>图片详情</span><button id="detail-close" class="icon-button close" aria-label="关闭图片详情">×</button></div><div class="detail-image"><img id="detail-image" alt=""></div><div class="detail-fields"><label>名称<input id="detail-name"></label><div id="detail-meta" class="subtle"></div><label>收藏意图与备注<textarea id="detail-note" rows="4" placeholder="你喜欢这张图的什么？"></textarea></label><div class="field-label">标签</div><div id="detail-tags"></div><div class="field-label">所属收藏夹</div><div id="detail-folders" class="folder-checkboxes"></div><div class="field-label">采集来源</div><div id="detail-sources"></div><div class="detail-actions"><button class="primary" id="detail-save">保存修改</button><button id="detail-trash">移入回收站</button><button id="detail-purge" class="danger hidden">永久删除</button></div></div></aside>
<div id="toast" class="toast hidden" role="status"></div>
</body></html>
