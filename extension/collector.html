<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏到 Plka</title><link rel="icon" href="brand.svg"><link rel="stylesheet" href="collector.css"><link rel="stylesheet" href="tag-picker.css"><script src="collector.js" type="module"></script></head><body><header><img class="mark" src="brand.svg" alt="Plka 标志"><div><img class="wordmark" src="wordmark.svg" alt="Plka"><small>A PLACE FOR IDEAS</small></div></header><section class="quick-access"><button id="open-library" type="button">打开 Plka 图库 ↗</button><label><input type="checkbox" id="all-sites-dock">所有网页显示入口</label></section><section id="setup" hidden><h2 id="setup-title">正在准备 Plka…</h2><p id="setup-message">正在自动识别这台电脑的图库。</p><p>第一次使用，请双击安装包里的 Plka 应用（Windows 为安装入口），仅需启用一次。以后打开 Chrome 就能直接收藏。</p><button id="setup-retry">我已启用，继续</button></section><section id="collector" hidden><div class="intro"><span>COLLECT SOMETHING GOOD</span><h1>留住这一刻的灵感<span>✳</span></h1></div><div class="page-title" id="page-title"></div><div class="selection-tools"><span id="image-count"></span><label><input type="checkbox" id="select-all">全选</label><span id="limit-note"></span></div><div id="images"></div><div class="form"><label>收藏到<select id="folder"></select></label><div class="new-folder"><input id="folder-name" placeholder="新建收藏夹" maxlength="80"><button id="create-folder">＋ 新建</button></div><label>收藏笔记<textarea id="note" rows="2" placeholder="为什么喜欢它？记下值得参考的细节。"></textarea></label><div class="field-label">标签<span>点选即亮，可多选</span></div><div id="tags"></div><p class="hint">保存网页可获取的图片，保留来源；图片分辨率以实际下载文件为准。</p><button id="save" class="primary">收藏到 Plka</button></div></section><p id="status" role="status"></p><dialog id="result-modal"><div class="result-symbol" aria-hidden="true">✓</div><h2 id="result-title">收藏成功</h2><p id="result-message"></p><div id="result-errors"></div><small id="result-close-note"></small><button id="result-dismiss">继续处理</button></dialog></body></html>
